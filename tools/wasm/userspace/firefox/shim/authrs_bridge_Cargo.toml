[package]
name = "authrs_bridge"
version = "0.1.0"
edition = "2021"
authors = ["Martin Sirringhaus", "John Schanck"]

[dependencies]
nserror = { path = "../../../xpcom/rust/nserror" }
nsstring = { path = "../../../xpcom/rust/nsstring" }
thin-vec = { version = "0.2.1", features = ["gecko-ffi"] }
xpcom = { path = "../../../xpcom/rust/xpcom" }
# Keep the workspace [patch] for libudev-sys referenced. Without a consumer,
# cargo wants to rewrite Cargo.lock under --frozen. Optional + never enabled
# for the normal gkrust build; cbindgen's --all-features only needs resolve.
libudev-sys = { version = "0.1.3", optional = true }

[features]
fuzzing = []
